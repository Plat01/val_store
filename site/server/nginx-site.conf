# Домен заменяется setup-server-site.sh, секретов здесь нет.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DOMAIN__ www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /var/www/soberi-stanok/public;
    index index.php;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    access_log /var/log/nginx/soberi-stanok.access.log;
    error_log /var/log/nginx/soberi-stanok.error.log;

    location = /xmlrpc.php { deny all; }
    location = /wp-config.php { deny all; }
    location ~ /\. { deny all; }
    location ~* ^/wp-content/(uploads|uploads-webpc)/.*\.(php[0-9]?|phtml|phar)(/|$) { deny all; }
    location ~* \.(sql|sql\.gz|bak|log|ini|conf|sh)$ { deny all; }
    # Вход WordPress: только HTTPS и Limit Login Attempts.
    location = /wp-admin/admin-ajax.php {
        include /etc/nginx/snippets/ss-fastcgi.conf;
    }
    location = /wp-login.php {
        include /etc/nginx/snippets/ss-fastcgi.conf;
    }
    location /wp-admin/ {
        location ~ \.php$ {
            include /etc/nginx/snippets/ss-fastcgi.conf;
        }
        try_files $uri $uri/ /index.php?$args;
    }
    location ~* ^/wp-content/(?<ss_img>uploads/.*\.(?:png|jpe?g|gif))$ {
        add_header Vary Accept;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        try_files /wp-content/uploads-webpc/$ss_img$ss_webp $uri =404;
    }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include /etc/nginx/snippets/ss-fastcgi.conf;
    }
}
