fastcgi_cache_path /var/cache/nginx/soberi-stanok levels=1:2 keys_zone=SS:32m inactive=30m max_size=256m;
map $request_method $ss_skip_method { default 1; GET 0; HEAD 0; }
map $query_string $ss_skip_query { default 1; "" 0; }
map $request_uri $ss_skip_uri {
    default 0;
    ~*^/(cart|checkout|my-account|wp-admin|wp-login\.php|wp-json|wc-api)(/|\?|$) 1;
    ~*^/(feed|sitemap|robots\.txt) 1;
    ~*sitemap.*\.xml 1;
}
map $http_cookie $ss_skip_cookie {
    default 0;
    ~*wordpress_logged_in|wordpress_sec|wp-postpass|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|comment_author 1;
}
map "$ss_skip_method$ss_skip_query$ss_skip_uri$ss_skip_cookie" $ss_skip_cache { default 1; "0000" 0; }
map $http_accept $ss_webp { default ""; ~*image/webp ".webp"; }
server_tokens off;
