<title id="title">собери станок</title>
<desc id="desc">Монограмма из двух букв «с»: собери станок. Буквы соединяются как модули конструктора. Одноцветная версия. Прозрачный фон; все видимые элементы — редактируемые векторные контуры.</desc>
