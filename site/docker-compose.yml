name: soberi-stanok

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
  WORDPRESS_TABLE_PREFIX: ss_
  WORDPRESS_DEBUG: "1"
  WP_CLI_CONFIG_PATH: /config/wp-cli.yml
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
    define('WP_POST_REVISIONS', 10);
    define('SS_SMTP_HOST', 'mailpit');
    define('SS_SMTP_PORT', 1025);

x-wp-volumes: &wp-volumes
  - ${WP_ROOT:-./wp}:/var/www/html
  - ./wp-content/themes/soberi-stanok:/var/www/html/wp-content/themes/soberi-stanok
  - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
  - ./config:/config:ro
  - ./config/php.ini:/usr/local/etc/php/conf.d/zz-soberi-stanok.ini:ro
  - ./scripts:/scripts:ro
  - ${DATA_ROOT:-./data}:/data
  # Медиатека старого сайта (UPLOADS = 'files'), нужна только для импорта.
  - ${OLD_FILES:-../old_site/public_html/files}:/old-files:ro

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      APACHE_RUN_USER: "#${UID:-1000}"
      APACHE_RUN_GROUP: "#${GID:-1000}"
    volumes: *wp-volumes
    ports:
      - "${WP_PORT:-8080}:80"

  wpcli:
    image: wordpress:cli-php8.3
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      WP_URL: ${WP_URL:-http://localhost:8080}
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    working_dir: /var/www/html
    entrypoint: ["wp"]
    profiles: ["cli"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on: [db]
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    ports:
      - "${PMA_PORT:-8081}:80"
    profiles: ["tools"]

volumes:
  db:
